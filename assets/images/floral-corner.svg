<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="petal-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f5f7f4"/>
      <stop offset="100%" stop-color="#e2e9e4"/>
    </linearGradient>
    <linearGradient id="petal-grad-2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f8f6f0"/>
      <stop offset="100%" stop-color="#e5e0d4"/>
    </linearGradient>
    <linearGradient id="leaf-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8ba896"/>
      <stop offset="50%" stop-color="#567965"/>
      <stop offset="100%" stop-color="#365040"/>
    </linearGradient>
    <linearGradient id="leaf-grad-2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#739781"/>
      <stop offset="70%" stop-color="#466453"/>
      <stop offset="100%" stop-color="#2a3d32"/>
    </linearGradient>
    <radialGradient id="flower-center" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#faf5e8"/>
      <stop offset="60%" stop-color="#eae0cc"/>
      <stop offset="100%" stop-color="#cfc2a7"/>
    </radialGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="6" stdDeviation="6" flood-color="#14281c" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g filter="url(#soft-shadow)">
    <!-- Leaves Background -->
    <!-- Leaf 1 -->
    <path d="M 60 120 C 30 70 80 20 150 40 C 200 60 180 120 130 140 C 90 150 70 140 60 120 Z" fill="url(#leaf-grad-1)" opacity="0.9"/>
    <path d="M 60 120 Q 120 80 150 40" stroke="#365040" stroke-width="2" fill="none" opacity="0.6"/>

    <!-- Leaf 2 -->
    <path d="M 120 50 C 140 10 220 0 260 50 C 280 100 220 130 170 120 C 130 110 110 80 120 50 Z" fill="url(#leaf-grad-2)" opacity="0.85"/>
    <path d="M 120 50 Q 190 50 260 50" stroke="#2a3d32" stroke-width="2" fill="none" opacity="0.6"/>

    <!-- Leaf 3 (Outer edge) -->
    <path d="M 20 200 C 0 140 30 80 90 80 C 140 80 140 150 110 190 C 70 230 30 230 20 200 Z" fill="url(#leaf-grad-1)" opacity="0.9"/>
    <path d="M 20 200 Q 60 140 90 80" stroke="#365040" stroke-width="2" fill="none" opacity="0.6"/>

    <!-- Buds & Small Leaves -->
    <ellipse cx="290" cy="80" rx="14" ry="24" transform="rotate(35 290 80)" fill="url(#petal-grad-1)" opacity="0.95"/>
    <ellipse cx="40" cy="270" rx="16" ry="26" transform="rotate(-40 40 270)" fill="url(#petal-grad-2)" opacity="0.95"/>

    <!-- Main Corner Gardenia / White Rose (Big Flower at 120, 150) -->
    <g transform="translate(140, 160)">
      <!-- Outer Petals -->
      <path d="M 0 -130 C 60 -135 110 -90 115 -30 C 120 20 70 60 0 50 C -70 60 -120 20 -115 -30 C -110 -90 -60 -135 0 -130 Z" fill="url(#petal-grad-1)"/>
      <path d="M 80 -100 C 140 -60 160 20 120 80 C 80 130 10 120 -40 80 C -80 40 -60 -40 0 -80 C 40 -100 60 -110 80 -100 Z" fill="url(#petal-grad-2)"/>
      <path d="M -80 -100 C -40 -110 -20 -100 20 -80 C 80 -40 100 40 60 80 C 10 120 -60 130 -100 80 C -140 20 -120 -60 -80 -100 Z" fill="url(#petal-grad-1)"/>
      <path d="M 0 120 C 70 120 120 70 110 0 C 100 -60 40 -70 0 -60 C -40 -70 -100 -60 -110 0 C -120 70 -70 120 0 120 Z" fill="url(#petal-grad-2)"/>

      <!-- Mid-tier Layer Petals -->
      <path d="M -60 -50 C -40 -90 40 -90 60 -50 C 80 -10 60 40 0 55 C -60 40 -80 -10 -60 -50 Z" fill="url(#petal-grad-1)"/>
      <path d="M 50 -40 C 90 -10 80 50 40 70 C 0 85 -50 60 -50 10 C -50 -30 10 -60 50 -40 Z" fill="url(#petal-grad-2)"/>
      <path d="M -50 -40 C -10 -60 50 -30 50 10 C 50 60 0 85 -40 70 C -80 50 -90 -10 -50 -40 Z" fill="url(#petal-grad-1)"/>

      <!-- Inner Rose / Gardenia Swirl -->
      <path d="M -30 -30 C -15 -50 25 -50 35 -25 C 45 0 25 30 0 35 C -25 30 -40 0 -30 -30 Z" fill="url(#petal-grad-2)"/>
      <path d="M 20 -20 C 35 -5 30 20 15 25 C 0 30 -20 20 -20 0 C -20 -15 5 -25 20 -20 Z" fill="url(#petal-grad-1)"/>
      <path d="M -15 -15 C -5 -25 15 -20 18 -5 C 20 10 5 20 -5 18 C -15 15 -20 0 -15 -15 Z" fill="url(#flower-center)"/>
      <circle cx="0" cy="0" r="10" fill="#e2d6be" opacity="0.8"/>
    </g>

    <!-- Secondary Flower (Top Right at 320, 70) -->
    <g transform="translate(330, 80) scale(0.65) rotate(45)">
      <path d="M 0 -100 C 50 -105 90 -70 95 -20 C 100 20 60 50 0 45 C -60 50 -100 20 -95 -20 C -90 -70 -50 -105 0 -100 Z" fill="url(#petal-grad-1)"/>
      <path d="M 70 -70 C 110 -40 120 20 90 60 C 60 100 10 90 -30 60 C -60 30 -40 -30 0 -60 C 30 -80 50 -85 70 -70 Z" fill="url(#petal-grad-2)"/>
      <path d="M -70 -70 C -50 -85 -30 -80 0 -60 C 40 -30 60 30 30 60 C -10 90 -60 100 -90 60 C -120 20 -110 -40 -70 -70 Z" fill="url(#petal-grad-1)"/>
      <path d="M 0 90 C 50 90 90 50 85 0 C 80 -40 30 -50 0 -45 C -30 -50 -80 -40 -85 0 C -90 50 -50 90 0 90 Z" fill="url(#petal-grad-2)"/>
      <!-- Inner -->
      <circle cx="0" cy="0" r="25" fill="url(#petal-grad-1)"/>
      <circle cx="0" cy="0" r="12" fill="url(#flower-center)"/>
    </g>

    <!-- Tertiary Flower (Bottom Left at 70, 320) -->
    <g transform="translate(80, 330) scale(0.68) rotate(-30)">
      <path d="M 0 -100 C 50 -105 90 -70 95 -20 C 100 20 60 50 0 45 C -60 50 -100 20 -95 -20 C -90 -70 -50 -105 0 -100 Z" fill="url(#petal-grad-1)"/>
      <path d="M 70 -70 C 110 -40 120 20 90 60 C 60 100 10 90 -30 60 C -60 30 -40 -30 0 -60 C 30 -80 50 -85 70 -70 Z" fill="url(#petal-grad-2)"/>
      <path d="M -70 -70 C -50 -85 -30 -80 0 -60 C 40 -30 60 30 30 60 C -10 90 -60 100 -90 60 C -120 20 -110 -40 -70 -70 Z" fill="url(#petal-grad-1)"/>
      <!-- Inner -->
      <circle cx="0" cy="0" r="28" fill="url(#petal-grad-2)"/>
      <circle cx="0" cy="0" r="14" fill="url(#flower-center)"/>
    </g>
  </g>
</svg>
