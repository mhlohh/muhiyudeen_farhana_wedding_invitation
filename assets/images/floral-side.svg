<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 600" width="100%" height="100%">
  <defs>
    <linearGradient id="side-petal-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f5f7f4"/>
      <stop offset="100%" stop-color="#dde6e0"/>
    </linearGradient>
    <linearGradient id="side-leaf-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7e9e8a"/>
      <stop offset="60%" stop-color="#4e6f5a"/>
      <stop offset="100%" stop-color="#2c4434"/>
    </linearGradient>
  </defs>

  <g filter="drop-shadow(0 10px 20px rgba(10, 25, 15, 0.3))">
    <!-- Leaves -->
    <path d="M 10 180 C 40 130 110 150 140 210 C 120 270 50 260 10 180 Z" fill="url(#side-leaf-1)" opacity="0.85"/>
    <path d="M 20 380 C 60 320 130 350 150 420 C 110 470 40 450 20 380 Z" fill="url(#side-leaf-1)" opacity="0.85"/>
    
    <!-- Buds -->
    <ellipse cx="160" cy="180" rx="12" ry="20" transform="rotate(25 160 180)" fill="url(#side-petal-1)"/>
    <ellipse cx="170" cy="410" rx="14" ry="22" transform="rotate(-30 170 410)" fill="url(#side-petal-1)"/>

    <!-- Mid Flower -->
    <g transform="translate(60, 300) scale(0.9)">
      <circle cx="0" cy="0" r="70" fill="url(#side-petal-1)" opacity="0.95"/>
      <circle cx="0" cy="0" r="45" fill="#ffffff"/>
      <circle cx="0" cy="0" r="22" fill="#ece4d2"/>
    </g>
  </g>
</svg>
